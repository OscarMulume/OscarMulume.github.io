[package]
name = "msec-pos-desktop"
version = "0.1.0"
description = "M-Sec POS — caisse fixe (Tauri 2)"
edition = "2021"

[lib]
name = "msec_pos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
keyring = { version = "3", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true